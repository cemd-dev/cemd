# joung2008.toml
# Alkali and halide ion parameters for TIP3P, TIP4P-Ew and SPC/E water (Joung & Cheatham 2008)
# Reference: https://doi.org/10.1021/jp8001614 (Table 5). sigma = 2 (Rmin/2) / 2^(1/6). Mixing rule: Lorentz-Berthelot.
# One type per ion and water model: use na_spce with spce.toml, na_tip3p with tip3p.toml,
# na_tip4pew with tip4p_ew.toml.

[model]
name = "Joung-Cheatham 2008"
ref = "https://doi.org/10.1021/jp8001614"
description = "Monovalent ion parameters specific to TIP3P, TIP4P-Ew and SPC/E water"
category = "ions"
mixing = "arithmetic"
mixing_note = "AMBER convention"

# ============================================================
# Atom Types
# ============================================================

[atom]

[atom.li_tip3p]
element = "Li"
charge = 1.0
environment = "aqueous Li ion for TIP3P water"
ref = "https://doi.org/10.1021/jp8001614"

[atom.li_tip4pew]
element = "Li"
charge = 1.0
environment = "aqueous Li ion for TIP4P-Ew water"
