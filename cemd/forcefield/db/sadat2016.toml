# sadat2016.toml
# Geopolymer / metakaolin force field of Sadat et al. 2016 (J. Chem. Phys. 145, 134706), Table I
# Reference: https://doi.org/10.1063/1.4964301
# Si/Al/O: Teter potential as used by Sperinck et al. 2011 (https://doi.org/10.1039/c0jm01748e);
# water: SPC/Fw. Energies converted from eV (1 eV = 23.060548 kcal/mol).
# Not represented: the Si-Ow and Al-Ow composite potentials of Sadat et al.
# Ca and K are in neither Sadat 2016 nor Sperinck 2011: origin unverified.

[model]
name = "Sadat 2016"
ref = "https://doi.org/10.1063/1.4964301"
description = "Force field for geopolymer/metakaolin"
category = "minerals"
mixing = "none"
mixing_note = "Pair-specific Buckingham and LJ terms"

# ============================================================
# Atom Types
# ============================================================

[atom]

[atom.algp]
element = "Al"
charge = 1.8
environment = "aluminium in geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.cagp]
element = "Ca"
charge = 1.2
environment = "geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.hwgp]
element = "H"
charge = 0.41
environment = "fw/spc water for geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.kgp]
element = "K"
charge = 0.6
environment = "geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.nagp]
element = "Na"
charge = 0.6
environment = "geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.ogp]
element = "O"
charge = -1.2
environment = "geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.owgp]
element = "O"
charge = -0.82
environment = "fw/spc water for geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

[atom.sigp]
element = "Si"
charge = 2.4
environment = "geopolymer/metakaolin"
ref = "https://doi.org/10.1063/1.4964301"

