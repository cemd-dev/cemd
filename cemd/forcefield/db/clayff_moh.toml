# clayff_moh.toml
# ClayFF with metal-O-H angle bending and Morse O-H stretch (ClayFF-MOH)
# References: https://doi.org/10.1021/acs.jpcc.1c04600 (Cygan et al. 2021, SI Tables S1-S2)
#             https://doi.org/10.1021/acs.jpcc.7b05362 (Pouvreau et al. 2017, M-O-H terms)
#
# Nonbonded parameters: Table S1 of Cygan et al. 2021. Differences with clayff.toml (2004):
#   epsilon(feo, lio) = 9.0298e-7 (2004: 9.0298e-6); sigma(cah) = sigma(cao) = 5.5667
#   (2004: R0 = 6.2428, i.e. sigma = 5.5617; the 2021 LAMMPS sample uses 5.5624).
# O-H: Morse, dioctahedral set on oh-ho and trioctahedral set on ohs-ho, following the
#   ClayFF convention that trioctahedral sheets use the substituted types (ohs, obts, obss).
# M-O-H angles: bulk values. Surface/edge hydroxyls use theta0 = 110 deg for ao and mgo.
# Energies: E = K (r - r0)^2, E = K (theta - theta0)^2, E = D [1 - exp(-alpha (r - r0))]^2.

[model]
name = "ClayFF-MOH"
ref = "https://doi.org/10.1021/acs.jpcc.1c04600"
description = "ClayFF with Morse O-H and metal-O-H angle terms (Cygan et al. 2021; Pouvreau et al. 2017)"
category = "minerals"
mixing = "arithmetic"

