# iff.toml
# Force field parameters for IFF (Interface Force Field)
# Reference: https://doi.org/10.1039/C4DT00438H

[model]
name = "IFF"
ref = "https://doi.org/10.1039/C4DT00438H"
description = "Interface Force Field: C3S, C3A, silica, calcium sulfates, portlandite and tobermorite (12-6 LJ)"
category = "minerals"
mixing = "arithmetic"
mixing_note = "12-6 CHARMM column; the portlandite and tobermorite block comes from the CVFF column (geometric rule)"

# ============================================================
# Atom Types
# ============================================================

[atom]

[atom.ac1]
element = "Al"
charge = 1.2
environment = "aluminate ring in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom.ca_a_a]
element = "Ca"
charge = 1.5
environment = "calcium ions in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

