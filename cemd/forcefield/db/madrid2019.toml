# madrid2019.toml
# Madrid-2019: scaled-charge ion force field for Li+, Na+, K+, Mg2+, Ca2+, Cl- and SO4(2-) in TIP4P/2005 water
# Reference: https://doi.org/10.1063/1.5121392 (Zeron et al. 2019, Tables I, III, IV)
# Units converted from nm and kJ/mol. Pairs marked 'LB' in the paper are not listed:
# apply the Lorentz-Berthelot (arithmetic) mixing rule for them.
# Water: rigid TIP4P/2005 (M-site charge carried by ow, d_OM = 0.1546 A, as in tip4p2005.toml).
# Sulfate: rigid tetrahedron, d_SO = 1.49 A (k = 0: geometry only).

[model]
name = "Madrid-2019"
ref = "https://doi.org/10.1063/1.5121392"
description = "Scaled-charge (0.85) ion and sulfate force field for TIP4P/2005 water"
category = "ions"
mixing = "arithmetic"
mixing_note = "Lorentz-Berthelot for the pairs marked LB in the paper; every other pair is listed"

# ============================================================
# Atom Types
# ============================================================

[atom]

[atom.li]
element = "Li"
charge = 0.85
environment = "lithium ion"
ref = "https://doi.org/10.1063/1.5121392"

[atom.na]
element = "Na"
charge = 0.85
environment = "sodium ion"
ref = "https://doi.org/10.1063/1.5121392"

[atom.k]
element = "K"
charge = 0.85
environment = "potassium ion"
ref = "https://doi.org/10.1063/1.5121392"

[atom.mg]
element = "Mg"
charge = 1.7
environment = "magnesium ion"
ref = "https://doi.org/10.1063/1.5121392"

[atom.ca]
element = "Ca"
charge = 1.7
environment = "calcium ion"
ref = "https://doi.org/10.1063/1.5121392"

[atom.cl]
element = "Cl"
charge = -0.85
environment = "chloride ion"
ref = "https://doi.org/10.1063/1.5121392"

[atom.s]
element = "S"
charge = 0.9
environment = "sulfur in sulfate"
ref = "https://doi.org/10.1063/1.5121392"

[atom.os]
element = "O"
charge = -0.65
environment = "oxygen in sulfate"
ref = "https://doi.org/10.1063/1.5121392"

[atom.ow]
element = "O"
charge = -1.1128
environment = "water oxygen (TIP4P/2005, charge on the M site)"
ref = "https://doi.org/10.1063/1.5121392"

[atom.hw]
element = "H"
charge = 0.5564
environment = "water hydrogen (TIP4P/2005)"
ref = "https://doi.org/10.1063/1.5121392"

