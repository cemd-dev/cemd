name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Lint only: `ruff format` is not enforced yet.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check --output-format=github cemd test

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Packmol is a hard requirement of every builder: without it the
      # tests that shell out to it skip themselves, which would leave the
      # integration paths -- the ones that broke most often -- unchecked.
      - name: Install Packmol
        run: |
          sudo apt-get update
          sudo apt-get install -y packmol
          packmol -h < /dev/null | head -3 || true

      # libgl and the xkb libraries are what Qt and VTK link against; the
      # GUI smoke test runs on the offscreen platform but still needs them
      # present to import.
      - name: Install the GUI system libraries
        run: |
          sudo apt-get install -y \
            libgl1 libglx-mesa0 libegl1 libopengl0 libglu1-mesa \
            libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-cursor0

      - name: Install cemd
        # The annotate plugin turns each failing test into a GitHub
        # annotation, so a red run says which test broke without having to
        # open the log.
        run: pip install ".[dev,gui]" pytest-github-actions-annotate-failures

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --cov=cemd --cov-report=term:skip-covered

      # The 3D view needs a GL context, which the offscreen platform above
      # cannot give, so its tests skip there. They run here on their own,
      # on a virtual X server with Mesa's software GL.
      - name: Run the 3D view tests
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a env QT_QPA_PLATFORM=xcb pytest -q test/unit/test_gui_view.py
