[project]
name = "cemd"
version = "0.1.0"
description = "Atomistic models of cements, clays, carbonates and oxide glasses, for LAMMPS"
readme = "README.rst"
authors = [{name = "Jérôme Claverie", email = "Jerome.claverie@univ-nantes.fr"}]
# GPL-3.0-only, not -or-later: the file headers read "as published by the
# Free Software Foundation, version 3" with no "or any later version".
license = "GPL-3.0-only"
license-files = ["LICENCE"]
requires-python = ">=3.11"
keywords = [
    "molecular dynamics",
    "LAMMPS",
    "cement",
    "C-S-H",
    "clay",
    "calcite",
    "carbonate",
    "oxide glass",
    "force field",
    "atomistic modelling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    # No "License :: OSI Approved :: ..." here: with the PEP 639
    # `license` expression above, the licence classifiers are deprecated
    # and saying it twice invites the two from disagreeing.
]
dependencies = [
    # Packmol is an external executable, not a Python library, but its
    # authors ship it on PyPI with wheels for Linux, macOS and Windows.
    # Depending on it means every builder works straight after
    # `pip install cemd`, instead of failing until the user installs
    # Packmol by hand and puts it on their PATH.
    "packmol",
    "numpy>=2.0,<3",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "MDAnalysis>=2.10",
    "pymatgen>=2024.0",
    "rdkit",
    "dask",
    "pydantic>=2.0,<3",
    "xlrd",
    "questionary",
]

[project.optional-dependencies]
gui = [
    # PySide6-Qlementine is a compiled binding tied to one exact PySide6
    # ABI -- its own metadata pins PySide6==6.10.2. Leaving PySide6 loose
    # let pip pair a fresh 6.11 with a Qlementine built against 6.10, and
    # importing the GUI then died on "libpyside6.abi3.so.6.10: cannot open
    # shared object file". The two versions have to move together.
    "PySide6==6.10.2",
    "PySide6-Qlementine==1.4.3.0rc7",
    "pyvista==0.47.2",
    "pyvistaqt==0.11.4",
    "vtk==9.6.2",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "numpydoc",
    # Loaded by docs/conf.py for the grid/card directives used on the
    # landing pages. It was missing here and only went unnoticed because
    # it happened to be installed in the development environment.
    "sphinx-design",
]
dev = [
    "pytest",
    "pytest-cov",
    "ipython",
]

[project.gui-scripts]
# gui-scripts rather than scripts: on Windows this launches without a
# console window behind the interface.
cemd-gui = "cemd.gui.main_window:main"

[project.urls]
Homepage = "https://github.com/cemd-dev/cemd"
Documentation = "https://cemd-dev.github.io/cemd/"
Repository = "https://github.com/cemd-dev/cemd"
Issues = "https://github.com/cemd-dev/cemd/issues"

[tool.setuptools.package-data]
# Without this, a built wheel contains nothing but .py files: no structure
# library, no force-field database, no icons. It goes unnoticed in an
# editable install, which reads straight from the source tree, and breaks
# every builder in a real one.
cemd = [
    "build/_structures/*.cif",
    "build/_structures/*.lt",
    "build/_structures/*.pdb",
    "build/_structures/*.sdf",
    "forcefield/db/*",
    "core/_view/*.tcl",
    "core/_view/*.toml",
    "gui/icons/*.svg",
    "gui/default_config.json",
]

[build-system]
# >=77 for the PEP 639 `license` / `license-files` fields above.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test/unit"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (gestion des imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade
]
unfixable = ["F401"]  # Empêche la suppression automatique des imports non utilisés
ignore = [
    "E501",  # Lignes trop longues (déjà géré par ruff format)
    "N813",  # CamelCase importé en lowercase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"