# One environment for all development. `conda env create -f environment.yml`
# builds it and installs cemd editable with every extra, so there is nothing
# to run afterwards.
#
# Everything except the Python version comes from pyproject.toml: this file
# exists to create and name the environment, not to duplicate the dependency
# list.
name: cemd
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e ".[dev,gui,docs]"
